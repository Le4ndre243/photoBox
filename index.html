<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1a1a;
      color: #e8e0d5;
      min-height: 100vh;
    }

    header {
      background: #111;
      padding: 1.2rem 2rem;
      border-bottom: 2px solid #c9a84c;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
      color: #c9a84c;
      letter-spacing: 0.12em;
      font-weight: normal;
      text-transform: uppercase;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── Erreur ── */
    #error-msg {
      background: #8b1a1a;
      color: #fff;
      padding: 0.75rem 1.2rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    #error-msg.hidden { display: none; }

    /* ── Section photo unique ── */
    section#photo-section {
      margin-bottom: 3rem;
    }

    section#photo-section h2 {
      font-size: 1.1rem;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    #la_photo {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      padding: 1.2rem;
    }

    #la_photo img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: block;
      background: #111;
    }

    #la_photo .photo-meta {
      padding: 1rem 0 0;
    }

    #la_photo .photo-titre {
      font-size: 1.1rem;
      font-weight: bold;
      color: #e8e0d5;
      margin-bottom: 0.4rem;
    }

    #la_photo .photo-desc {
      font-size: 0.9rem;
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }

    #la_photo .photo-type {
      font-size: 0.85rem;
      color: #888;
    }

    #la_categorie {
      display: inline-block;
      background: #c9a84c22;
      border: 1px solid #c9a84c55;
      color: #c9a84c;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.82rem;
      margin: 0.6rem 0;
    }

    .commentaires-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #aaa;
      margin: 0.8rem 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #les_commentaires {
      list-style: disc;
      padding-left: 1.5rem;
    }

    #les_commentaires li {
      font-size: 0.85rem;
      color: #bbb;
      line-height: 1.6;
    }

    /* ── Section galerie ── */
    section#galerie-section h2 {
      font-size: 1.1rem;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .nav-buttons {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }

    .nav-buttons button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e8e0d5;
      padding: 0.45rem 1rem;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-buttons button:hover:not(:disabled) {
      background: #c9a84c;
      border-color: #c9a84c;
      color: #111;
    }

    .nav-buttons button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #btn-load {
      background: #c9a84c !important;
      border-color: #c9a84c !important;
      color: #111 !important;
      font-weight: bold;
    }

    #btn-load:hover {
      background: #e0bf6a !important;
    }

    #la_galerie {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    #la_galerie .vignette {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      border-radius: 3px;
      background: #222;
    }

    #la_galerie .vignette img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    #la_galerie .vignette:hover img {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    #la_galerie .vignette .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      padding: 0.4rem 0.5rem 0.35rem;
      font-size: 0.75rem;
      color: #eee;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #la_galerie .vignette:hover .overlay {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>📷 Photobox</h1>
  </header>

  <main>

    <p id="error-msg" class="hidden"></p>

    <!-- ── Exercice 1 : affichage d'une photo ── -->
    <section id="photo-section">
      <h2>Photo</h2>
      <div id="la_photo">
        <p style="color:#666;font-style:italic;">Chargement de la photo…</p>
      </div>
    </section>

    <!-- ── Exercices 2-4 : galerie ── -->
    <section id="galerie-section">
      <h2>Galerie</h2>
      <div class="nav-buttons">
        <button id="btn-first" disabled>⏮ first</button>
        <button id="btn-prev" disabled>◀ prev</button>
        <button id="btn-load">⟳ load</button>
        <button id="btn-next" disabled>next ▶</button>
        <button id="btn-last" disabled>last ⏭</button>
      </div>
      <div id="la_galerie"></div>
    </section>

  </main>

  <!-- ══════════════════════════════════════
       Templates Handlebars
  ═══════════════════════════════════════ -->

  <!-- Template : affichage d'une photo unique (exercice 1) -->
  <script id="photo-template" type="text/x-handlebars-template">
    <img src="{{url}}" alt="{{titre}}">
    <div class="photo-meta">
      <p class="photo-titre">{{titre}}</p>
      {{#if description}}
        <p class="photo-desc">{{description}}</p>
      {{/if}}
      <p class="photo-type">{{type}}</p>
      <div>
        <span id="la_categorie"></span>
      </div>
      <p class="commentaires-label">commentaires :</p>
      <ul id="les_commentaires"></ul>
    </div>
  </script>

  <!-- Template : galerie de vignettes (exercice 2) -->
  <script id="galerie-template" type="text/x-handlebars-template">
    {{#each photos}}
      <div class="vignette" data-photo-id="{{id}}">
        <img src="{{url}}" alt="{{titre}}" loading="lazy">
        <div class="overlay">{{titre}}</div>
      </div>
    {{/each}}
  </script>

  <script src="dist/index.js"></script>
</body>
</html>
